<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">

  <title>3D Product Viewer</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <!-- ==========================================
       主要展示區
  =========================================== -->

  <div id="viewer">


    <!-- ========================================
         左側資訊欄
    ========================================= -->

    <aside id="info-panel">


      <!-- 標題 1 -->
      <div class="info-item active">

        <button class="info-title">

          <span class="title-icon">−</span>

          <span class="title-text">
            標題1
          </span>

        </button>


        <div class="info-content">

          <p>
            內容1 用EEEE表示內容
          </p>

          <p>
            EEEEEEEEEEEEEE<br>
            EEEEE<br>
            EEEEEEEEEEEE<br>
            EEEEEEEEEE。
          </p>

        </div>

      </div>


      <!-- 標題 2 -->
      <div class="info-item">

        <button class="info-title">

          <span class="title-icon">＋</span>

          <span class="title-text">
            標題2
          </span>

        </button>


        <div class="info-content">

          <p>
            這裡放標題2的說明內容。
          </p>

        </div>

      </div>


      <!-- 標題 3 -->
      <div class="info-item">

        <button class="info-title">

          <span class="title-icon">＋</span>

          <span class="title-text">
            標題3
          </span>

        </button>


        <div class="info-content">

          <p>
            這裡放標題3的說明內容。
          </p>

        </div>

      </div>


      <!-- 標題 4 -->
      <div class="info-item">

        <button class="info-title">

          <span class="title-icon">＋</span>

          <span class="title-text">
            標題4
          </span>

        </button>


        <div class="info-content">

          <p>
            這裡放標題4的說明內容。
          </p>

        </div>

      </div>


    </aside>


    <!-- ========================================
         右側 3D 區域
    ========================================= -->

    <main id="model-panel">


      <!-- Three.js Canvas
           main.js 會自動建立 -->


      <!-- 頁面指示點 -->
      <div id="page-dots">

        <button class="page-dot active"></button>

        <button class="page-dot"></button>

        <button class="page-dot"></button>

        <button class="page-dot"></button>

      </div>


    </main>


  </div>


  <!-- ==========================================
       底部控制區
       這一版先保留原本功能
  =========================================== -->

  <div id="icon-row">


    <!-- 旋轉速度 -->

    <div class="top-icon">

      <img
        src="./icons/icon-cube.svg"
        class="icon-cube"
        alt="Rotation"
      >

      <input
        type="range"
        id="rotateSpeed"
        min="0"
        max="0.05"
        step="0.001"
        value="0"
      >

    </div>


    <!-- 環境光 -->

    <div class="top-icon">

      <img
        src="./icons/icon-light.svg"
        class="icon-light"
        alt="Light"
      >

      <input
        type="range"
        id="ambientIntensity"
        min="0.1"
        max="2"
        step="0.1"
        value="1"
      >

    </div>


    <!-- Camera FOV -->

    <div class="top-icon">

      <img
        src="./icons/icon-camera.svg"
        class="icon-camera"
        alt="Camera"
      >

      <input
        type="range"
        id="cameraFov"
        min="30"
        max="90"
        step="1"
        value="45"
      >

    </div>


  </div>


  <!-- ==========================================
       Three.js
  =========================================== -->

  <script
    type="module"
    src="main.js">
  </script>

</body>

</html>
